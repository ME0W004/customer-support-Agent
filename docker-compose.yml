services:
  api:
    build: .
    container_name: ai_support_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  poller:
    build: .
    container_name: ai_support_poller
    restart: unless-stopped
    env_file:
      - .env
    command: ["uv", "run", "python", "-m", "app.poller"]
    depends_on:
      - api
